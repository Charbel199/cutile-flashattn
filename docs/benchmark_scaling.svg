<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 556" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" role="img" aria-label="Log-log chart of GPU kernel time per call in ms against sequence length 128 to 4096 on an RTX PRO 6000 Blackwell, fp16, median of 8 runs. Flash v2 (ours), PyTorch SDPA and Dao's flash_attn nearly overlap at every length: Flash v2 is within 10% of the faster of the two everywhere, from 4.2 microseconds at SEQ 128 (SDPA 4.4, flash_attn 5.0) to 1.91 ms at SEQ 4096 (SDPA 1.77, flash_attn 1.74). Flash v1 (ours) sits 1.5x to 1.8x above Flash v2 (0.65 ms at SEQ 2048, 3.08 ms at 4096). Manual PyTorch (4.8 ms) and the naive cuTile v2 kernel (18 ms) climb much faster and are 11x and 41x slower than Flash v2 at SEQ 2048. Cutile v1 (naive) only runs from SEQ 128 to 512 (0.36, 2.26 and 13.83 ms, the last two from single runs); at SEQ 1024 its cuTile compile does not finish.">
<title>Log-log chart of GPU kernel time per call in ms against sequence length 128 to 4096 on an RTX PRO 6000 Blackwell, fp16, median of 8 runs. Flash v2 (ours), PyTorch SDPA and Dao's flash_attn nearly overlap at every length: Flash v2 is within 10% of the faster of the two everywhere, from 4.2 microseconds at SEQ 128 (SDPA 4.4, flash_attn 5.0) to 1.91 ms at SEQ 4096 (SDPA 1.77, flash_attn 1.74). Flash v1 (ours) sits 1.5x to 1.8x above Flash v2 (0.65 ms at SEQ 2048, 3.08 ms at 4096). Manual PyTorch (4.8 ms) and the naive cuTile v2 kernel (18 ms) climb much faster and are 11x and 41x slower than Flash v2 at SEQ 2048. Cutile v1 (naive) only runs from SEQ 128 to 512 (0.36, 2.26 and 13.83 ms, the last two from single runs); at SEQ 1024 its cuTile compile does not finish.</title>
<text x="24" y="22" dy="0.35em" font-size="15" font-weight="700" fill="#1c1917">Attention kernel time vs sequence length</text>
<text x="24" y="46" dy="0.35em" font-size="13" fill="#78716c">GPU kernel time per call, median of 8 runs. RTX PRO 6000 Blackwell, fp16, B 4, H 32, D 64</text>
